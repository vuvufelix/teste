version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mediakit_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: magrelo123
      MYSQL_DATABASE: mediakit_db
      MYSQL_USER: root
      MYSQL_PASSWORD: magrelo123
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediakit_app
    restart: always
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: "mysql://root:magrelo123@mysql:3306/mediakit_db"
      JWT_ACCESS_SECRET: "dvnefvgnpoifjnpermfsaepkçrmdaueihbni9MIdfnvoifndifondfoivnDIAERNGORTJGNVOFNVOFNOSZkitndjndvnvoe"
      JWT_REFRESH_SECRET: "fcvnzfovnfoivnzofivnszoeifrojdcbdbfriklnvoidfrnveoinvdfovnoifnvofcnvozdfnzdroigbviMIDIAKITS"
      FRONTEND_URL: "http://localhost:5173"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  mysql_data: